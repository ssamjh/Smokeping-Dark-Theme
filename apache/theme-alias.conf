# Add these lines to the Apache config that serves SmokePing,
# BEFORE the broader "Alias /smokeping ..." line so the more
# specific /smokeping/theme path wins.
#
# For the linuxserver/smokeping docker image this goes in
# /config/site-confs/smokeping.conf

Alias /smokeping/theme /config/theme
<Directory "/config/theme">
    Require all granted
</Directory>
